# Dependabot só pra alertas: nada de PR a cada versão nova. Com o limite 0 as
# atualizações de rotina ficam desligadas, mas as correções de segurança (ligadas
# nas configurações do repo) continuam abrindo PR contra a dev, com este prefixo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # O vue-tsc não suporta o TypeScript 7 (ver CLAUDE.md).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
