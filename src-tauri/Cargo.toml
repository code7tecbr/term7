[package]
name = "term7"
version = "0.1.0"
description = "Terminal com interface moderna"
license = "MIT"
repository = "https://github.com/code7tecbr/term7"
edition = "2021"

[lib]
name = "term7_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
# Área de transferência pelo GTK (mesma versão que o Tauri já usa).
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
# preserve_order: ao reescrever o settings.json do Claude, mantém a ordem das chaves.
serde_json = { version = "1", features = ["preserve_order"] }
